  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication.AuthenticationApi
  summary: >-
    A client for the subset of Auth0 Authentication API endpoints needed to recover from an

    <code>mfa_required</code> error: triggering an MFA challenge, completing MFA via the OTP / OOB /

    recovery-code grants, and managing authenticators.
  remarks: >-
    This is implemented over System.Text.Json within this SDK. The interface name, registration

    (<xref href="Auth0.AspNetCore.Authentication.Auth0WebAppAuthenticationBuilder.WithAuthenticationApiClient" data-throw-if-not-resolved="false"></xref>) and method

    shapes intentionally mirror the planned <code>Auth0.AuthenticationApi</code> integration so that a

    future swap to that package is invisible to consumers. The request/response types in

    <code>Auth0.AspNetCore.Authentication.AuthenticationApi.Models</code> are this SDK's own and form a

    permanent public contract.
