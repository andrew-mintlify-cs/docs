  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication.CustomDomains
  summary: A pass-through cache implementation that does not cache configuration managers.
  remarks: >-
    Use this implementation when caching should be completely disabled.

    Every call to <xref href="Auth0.AspNetCore.Authentication.CustomDomains.NullConfigurationManagerCache.GetOrCreate(System.String%2cSystem.Func%7bSystem.String%2cMicrosoft.IdentityModel.Protocols.IConfigurationManager%7bMicrosoft.IdentityModel.Protocols.OpenIdConnect.OpenIdConnectConfiguration%7d%7d)" data-throw-if-not-resolved="false"></xref> will invoke the factory to create a new 

    configuration manager, which may impact performance but ensures fresh configuration manager instances.
  example:
  - >-
    <pre><code class="lang-csharp">// Disable caching

    options.ConfigurationManagerCache = new NullConfigurationManagerCache();</code></pre>
  syntax:
    content: 'public sealed class NullConfigurationManagerCache : IConfigurationManagerCache, IDisposable'
    content.vb: Public NotInheritable Class NullConfigurationManagerCache Implements IConfigurationManagerCache, IDisposable
