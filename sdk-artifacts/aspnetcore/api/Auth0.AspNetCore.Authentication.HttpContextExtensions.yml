    id: GetAccessTokenForConnectionAsync
    path: ../src/Auth0.AspNetCore.Authentication/HttpContextExtensions.cs
    startLine: 194
  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Retrieves a federated connection (Token Vault) access token for the audience/connection

    described by <code class="paramref">request</code> — a third-party API token (e.g. Google, GitHub)

    for the logged-in user. Reuses a cached token from the session when one is present and not

    expired; otherwise exchanges the session's refresh token for a new connection token and

    persists it.
  remarks: >-
    Like <xref href="Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenAsync(Microsoft.AspNetCore.Http.HttpContext%2cAuth0.AspNetCore.Authentication.AccessTokenRequest%2cSystem.String)" data-throw-if-not-resolved="false"></xref>, this method is not safe to call concurrently for the

    same session: it reads, mutates, and writes the stored tokens, and a concurrent refresh-token

    exchange can trip rotation reuse detection. Serialize calls per session.
  example: []
  syntax:
    content: public static Task<string?> GetAccessTokenForConnectionAsync(this HttpContext context, AccessTokenForConnectionRequest request, string? scheme = null)
    parameters:
    - id: context
      type: Microsoft.AspNetCore.Http.HttpContext
      description: The current <xref href="Microsoft.AspNetCore.Http.HttpContext" data-throw-if-not-resolved="false"></xref>.
    - id: request
      type: Auth0.AspNetCore.Authentication.AccessTokenForConnectionRequest
      description: The connection (and optional login hint) to request a token for.
    - id: scheme
      type: System.String
      description: The Auth0 authentication scheme. Defaults to <xref href="Auth0.AspNetCore.Authentication.Auth0Constants.AuthenticationScheme" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.Task{System.String}
      description: The connection access token, or <code>null</code> when no refresh token is available or the exchange failed.
    content.vb: Public Shared Function GetAccessTokenForConnectionAsync(context As HttpContext, request As AccessTokenForConnectionRequest, scheme As String = Nothing) As Task(Of String)
  overload: Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenForConnectionAsync*
  nameWithType.vb: HttpContextExtensions.GetAccessTokenForConnectionAsync(HttpContext, AccessTokenForConnectionRequest, String)
  fullName.vb: Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenForConnectionAsync(Microsoft.AspNetCore.Http.HttpContext, Auth0.AspNetCore.Authentication.AccessTokenForConnectionRequest, String)
  name.vb: GetAccessTokenForConnectionAsync(HttpContext, AccessTokenForConnectionRequest, String)
