  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Performs a Custom Token Exchange : exchanges the external token described by

    <code class="paramref">request</code> for Auth0 tokens, without a browser redirect. This is the

    stateless utility — it has <b>no session side-effects</b> (it does not sign the user in or

    write any cookie); the caller decides what to persist. Use it for delegation/impersonation

    and agent-identity scenarios.
  example: []
  syntax:
    content: public static Task<CustomTokenExchangeResult> CustomTokenExchangeAsync(this HttpContext context, CustomTokenExchangeRequest request, string? scheme = null)
    parameters:
    - id: context
      type: Microsoft.AspNetCore.Http.HttpContext
      description: The current <xref href="Microsoft.AspNetCore.Http.HttpContext" data-throw-if-not-resolved="false"></xref>.
    - id: request
      type: Auth0.AspNetCore.Authentication.CustomTokenExchangeRequest
      description: >-
        The exchange request (subject token + type, and optional audience,
            scope, actor token pair, organization).
    - id: scheme
      type: System.String
      description: The Auth0 authentication scheme. Defaults to <xref href="Auth0.AspNetCore.Authentication.Auth0Constants.AuthenticationScheme" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.Task{Auth0.AspNetCore.Authentication.CustomTokenExchangeResult}
      description: The exchanged tokens.
    content.vb: Public Shared Function CustomTokenExchangeAsync(context As HttpContext, request As CustomTokenExchangeRequest, scheme As String = Nothing) As Task(Of CustomTokenExchangeResult)
  overload: Auth0.AspNetCore.Authentication.HttpContextExtensions.CustomTokenExchangeAsync*
  exceptions:
  - type: Auth0.AspNetCore.Authentication.CustomTokenExchangeException
    commentId: T:Auth0.AspNetCore.Authentication.CustomTokenExchangeException
    description: >-
      Thrown when the request fails client-side validation, or when the token endpoint rejects

      the exchange.
  nameWithType.vb: HttpContextExtensions.CustomTokenExchangeAsync(HttpContext, CustomTokenExchangeRequest, String)
  fullName.vb: Auth0.AspNetCore.Authentication.HttpContextExtensions.CustomTokenExchangeAsync(Microsoft.AspNetCore.Http.HttpContext, Auth0.AspNetCore.Authentication.CustomTokenExchangeRequest, String)
  name.vb: CustomTokenExchangeAsync(HttpContext, CustomTokenExchangeRequest, String)
