- uid: Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenAsync(Microsoft.AspNetCore.Http.HttpContext,Auth0.AspNetCore.Authentication.AccessTokenRequest,System.String)
  commentId: M:Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenAsync(Microsoft.AspNetCore.Http.HttpContext,Auth0.AspNetCore.Authentication.AccessTokenRequest,System.String)
  id: GetAccessTokenAsync(Microsoft.AspNetCore.Http.HttpContext,Auth0.AspNetCore.Authentication.AccessTokenRequest,System.String)
  isExtensionMethod: true
  parent: Auth0.AspNetCore.Authentication.HttpContextExtensions
  langs:
  - csharp
  - vb
  name: GetAccessTokenAsync(HttpContext, AccessTokenRequest, string?)
  nameWithType: HttpContextExtensions.GetAccessTokenAsync(HttpContext, AccessTokenRequest, string?)
  fullName: Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenAsync(Microsoft.AspNetCore.Http.HttpContext, Auth0.AspNetCore.Authentication.AccessTokenRequest, string?)
  type: Method
  source:
    remote:
      path: src/Auth0.AspNetCore.Authentication/HttpContextExtensions.cs
      branch: main
      repo: https://github.com/auth0/auth0-aspnetcore-authentication
    id: GetAccessTokenAsync
    path: ../src/Auth0.AspNetCore.Authentication/HttpContextExtensions.cs
    startLine: 63
  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Retrieves an access token for the audience/scope described by <code class="paramref">request</code>.

    Reuses a cached token from the session when one is present and not expired; otherwise

    exchanges the session's refresh token for a new token and persists it.
  remarks: >-
    This method is not safe to call concurrently for the same session. It reads the session,

    modifies the stored tokens in memory, and writes them back; concurrent calls each operate on

    their own snapshot, so the last write wins and a freshly fetched token from another in-flight

    call can be silently dropped. More importantly, when refresh-token rotation is enabled,

    concurrent calls exchange the same refresh token: the second exchange presents an

    already-rotated token, which can trigger refresh-token reuse detection and invalidate the

    entire session.


    <p>

    To avoid this, ensure only one <xref href="Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenAsync(Microsoft.AspNetCore.Http.HttpContext%2cAuth0.AspNetCore.Authentication.AccessTokenRequest%2cSystem.String)" data-throw-if-not-resolved="false"></xref> call is in flight per session

    at a time. Either don't issue parallel requests that each trigger a refresh, or plug in a

    server-side session store via

    <xref href="Auth0.AspNetCore.Authentication.Auth0WebAppAuthenticationBuilder.WithSessionStore(Microsoft.AspNetCore.Authentication.Cookies.ITicketStore)" data-throw-if-not-resolved="false"></xref>

    whose <code>ITicketStore</code> serializes concurrent access per session.

    </p>
  example: []
  syntax:
    content: public static Task<string?> GetAccessTokenAsync(this HttpContext context, AccessTokenRequest request, string? scheme = null)
    parameters:
    - id: context
      type: Microsoft.AspNetCore.Http.HttpContext
      description: The current <xref href="Microsoft.AspNetCore.Http.HttpContext" data-throw-if-not-resolved="false"></xref>.
    - id: request
      type: Auth0.AspNetCore.Authentication.AccessTokenRequest
      description: The audience/scope to request a token for.
    - id: scheme
      type: System.String
      description: The Auth0 authentication scheme. Defaults to <xref href="Auth0.AspNetCore.Authentication.Auth0Constants.AuthenticationScheme" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.Task{System.String}
      description: The access token, or <code>null</code> when no refresh token is available or the refresh failed.
    content.vb: Public Shared Function GetAccessTokenAsync(context As HttpContext, request As AccessTokenRequest, scheme As String = Nothing) As Task(Of String)
  overload: Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenAsync*
  exceptions:
  - type: Auth0.AspNetCore.Authentication.MfaRequiredException
    commentId: T:Auth0.AspNetCore.Authentication.MfaRequiredException
    description: >-
      Thrown when the token exchange returns an <code>mfa_required</code> error carrying an <code>mfa_token</code>.

      This is a recoverable challenge rather than a terminal failure: drive the MFA challenge/verify

      flow with <xref href="Auth0.AspNetCore.Authentication.AuthenticationApi.IAuthenticationApiClient" data-throw-if-not-resolved="false"></xref> (registered via

      <xref href="Auth0.AspNetCore.Authentication.Auth0WebAppAuthenticationBuilder.WithAuthenticationApiClient" data-throw-if-not-resolved="false"></xref>) using the

      <xref href="Auth0.AspNetCore.Authentication.MfaRequiredException.MfaToken" data-throw-if-not-resolved="false"></xref> blob. A malformed <code>mfa_required</code> response with no

      <code>mfa_token</code> is folded into the refresh-failed path instead.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      Thrown when a refresh succeeds but the new token cannot be persisted because the response has

      already started. Persisting the refreshed token calls <xref href="Microsoft.AspNetCore.Authentication.AuthenticationHttpContextExtensions.SignInAsync(Microsoft.AspNetCore.Http.HttpContext%2cSystem.String%2cSystem.Security.Claims.ClaimsPrincipal%2cMicrosoft.AspNetCore.Authentication.AuthenticationProperties)" data-throw-if-not-resolved="false"></xref>,

      which writes the authentication cookie; if the headers have already been sent, this throws and

      the exception propagates out of this method rather than being folded into the refresh-failed path.
  nameWithType.vb: HttpContextExtensions.GetAccessTokenAsync(HttpContext, AccessTokenRequest, String)
  fullName.vb: Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenAsync(Microsoft.AspNetCore.Http.HttpContext, Auth0.AspNetCore.Authentication.AccessTokenRequest, String)
  name.vb: GetAccessTokenAsync(HttpContext, AccessTokenRequest, String)
