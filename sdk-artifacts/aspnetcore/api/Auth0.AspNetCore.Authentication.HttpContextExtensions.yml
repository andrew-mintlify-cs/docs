  fullName: Auth0.AspNetCore.Authentication.HttpContextExtensions.GetAccessTokenForConnectionAsync(Microsoft.AspNetCore.Http.HttpContext, Auth0.AspNetCore.Authentication.AccessTokenForConnectionRequest, string?)
  type: Method
  source:
    remote:
      path: src/Auth0.AspNetCore.Authentication/HttpContextExtensions.cs
      branch: main
