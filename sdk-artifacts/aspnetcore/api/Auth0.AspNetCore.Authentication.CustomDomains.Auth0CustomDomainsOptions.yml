  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication.CustomDomains
  summary: Cache implementation for OpenID Connect configuration managers.
  remarks: >-
    <p>

    If not set, a default <xref href="Auth0.AspNetCore.Authentication.CustomDomains.MemoryConfigurationManagerCache" data-throw-if-not-resolved="false"></xref> is used with 

    100 entries and no expiration.

    </p>

    <p>

    To customize the default cache settings:


    <pre><code class="lang-csharp">options.ConfigurationManagerCache = new MemoryConfigurationManagerCache(
        maxSize: 50,
        slidingExpiration: TimeSpan.FromHours(1)
    );</code></pre>

    </p>

    <p>

    To disable caching:


    <pre><code class="lang-csharp">options.ConfigurationManagerCache = new NullConfigurationManagerCache();</code></pre>

    </p>

    <p>

    To provide a custom cache implementation, implement <xref href="Auth0.AspNetCore.Authentication.CustomDomains.IConfigurationManagerCache" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: public IConfigurationManagerCache? ConfigurationManagerCache { get; set; }
    parameters: []
    return:
      type: Auth0.AspNetCore.Authentication.CustomDomains.IConfigurationManagerCache
    content.vb: Public Property ConfigurationManagerCache As IConfigurationManagerCache
  overload: Auth0.AspNetCore.Authentication.CustomDomains.Auth0CustomDomainsOptions.ConfigurationManagerCache*
