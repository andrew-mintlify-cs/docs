  namespace: Auth0.AspNetCore.Authentication.CustomDomains
  summary: Resolves the Domain (issuer) for the current request.
  remarks: >-
    This function is called for each authentication request to dynamically determine

    which Auth0 custom domain should handle the request. The returned value should

    be just the domain without protocol or paths.
  example:
  - >-
    <pre><code class="lang-csharp">options.DomainResolver = async (context) =&gt;

    {
        var tenant = context.Request.Host.Host.Split('.').First();
        return $"{tenant}.auth0.com";
    };</code></pre>
  syntax:
    content: public Func<HttpContext, Task<string>>? DomainResolver { get; set; }
    parameters: []
    return:
      type: System.Func{Microsoft.AspNetCore.Http.HttpContext,System.Threading.Tasks.Task{System.String}}
    content.vb: Public Property DomainResolver As Func(Of HttpContext, Task(Of String))
