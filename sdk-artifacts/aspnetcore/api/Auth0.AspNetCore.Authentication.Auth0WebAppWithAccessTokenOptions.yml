    startLine: 46
  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    When <code>true</code>, the <xref href="System.Security.Claims.ClaimsPrincipal" data-throw-if-not-resolved="false"></xref> is rebuilt

    from the refreshed <code>id_token</code> after a successful primary token refresh, so

    <code>User.Claims</code> reflect current user information. Defaults to <code>false</code>, which

    preserves the historical behavior where claims are never updated on refresh.
  example: []
  syntax:
    content: public bool RebuildPrincipalOnRefresh { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property RebuildPrincipalOnRefresh As Boolean
