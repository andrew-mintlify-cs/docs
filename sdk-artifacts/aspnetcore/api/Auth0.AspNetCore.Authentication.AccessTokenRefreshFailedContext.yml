  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Provides the details of a failed access-token refresh to subscribers of

    <xref href="Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenEvents.OnAccessTokenRefreshFailed" data-throw-if-not-resolved="false"></xref>, so they can

    distinguish a terminal failure (such as an <code>invalid_grant</code> for a revoked or expired

    refresh token, which warrants a re-login) from a transient one (such as a timeout or a

    rate-limit, which may be retried).
