  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    The exception that caused the failure, when the refresh threw rather than returning

    an HTTP error (for example a transport failure, timeout, or misconfiguration).

    <code>null</code> when the failure was an HTTP rejection — see <xref href="Auth0.AspNetCore.Authentication.AccessTokenRefreshFailedContext.StatusCode" data-throw-if-not-resolved="false"></xref>,

    <xref href="Auth0.AspNetCore.Authentication.AccessTokenRefreshFailedContext.Error" data-throw-if-not-resolved="false"></xref>, and <xref href="Auth0.AspNetCore.Authentication.AccessTokenRefreshFailedContext.ErrorDescription" data-throw-if-not-resolved="false"></xref>.

    May contain transport/diagnostic detail; log server-side only, do not surface to end users.
  example: []
  syntax:
    content: public Exception? Exception { get; }
    parameters: []
    return:
      type: System.Exception
    content.vb: Public ReadOnly Property Exception As Exception
