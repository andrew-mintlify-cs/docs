    startLine: 7
  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Controls how rigorously the refreshed <code>id_token</code> is validated before its claims

    replace the <xref href="System.Security.Claims.ClaimsPrincipal" data-throw-if-not-resolved="false"></xref> when

    <xref href="Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenOptions.RebuildPrincipalOnRefresh" data-throw-if-not-resolved="false"></xref> is enabled.
