- uid: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.Full
  commentId: F:Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.Full
  id: Full
  parent: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType
  langs:
  - csharp
  - vb
  name: Full
  nameWithType: RefreshClaimsValidationType.Full
  fullName: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.Full
  type: Field
  source:
    remote:
      path: src/Auth0.AspNetCore.Authentication/RefreshClaimsValidationType.cs
      branch: main
      repo: https://github.com/auth0/auth0-aspnetcore-authentication
    id: Full
    path: ../src/Auth0.AspNetCore.Authentication/RefreshClaimsValidationType.cs
    startLine: 16
  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Validate the refreshed <code>id_token</code> signature against the cached JWKS, plus

    issuer, audience and lifetime, and the SDK's business-rule checks (sub, iat, azp, org).

    The <code>auth_time</code>/<code>MaxAge</code> login-freshness check is intentionally not applied

    on refresh, since a refresh grant does not re-authenticate the user. This is the

    default and the safe choice.
  example: []
  syntax:
    content: Full = 0
    return:
      type: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType
- uid: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.SkipSignature
  commentId: F:Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.SkipSignature
  id: SkipSignature
  parent: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType
  langs:
  - csharp
  - vb
  name: SkipSignature
  nameWithType: RefreshClaimsValidationType.SkipSignature
  fullName: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.SkipSignature
  type: Field
  source:
    remote:
      path: src/Auth0.AspNetCore.Authentication/RefreshClaimsValidationType.cs
      branch: main
      repo: https://github.com/auth0/auth0-aspnetcore-authentication
    id: SkipSignature
    path: ../src/Auth0.AspNetCore.Authentication/RefreshClaimsValidationType.cs
    startLine: 25
  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Skip <b>only</b> the cryptographic signature check (trusting the back-channel TLS

    exchange with the token endpoint). Issuer, audience and lifetime are still validated,

    and the SDK's business-rule checks (sub, iat, azp, org) still run, so the resulting

    claims are mapped identically to <xref href="Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.Full" data-throw-if-not-resolved="false"></xref>. Lower cost and lower fidelity

    than <xref href="Auth0.AspNetCore.Authentication.RefreshClaimsValidationType.Full" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: SkipSignature = 1
    return:
      type: Auth0.AspNetCore.Authentication.RefreshClaimsValidationType
