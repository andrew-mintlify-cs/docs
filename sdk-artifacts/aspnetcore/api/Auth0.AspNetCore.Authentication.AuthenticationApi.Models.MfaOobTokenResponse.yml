  namespace: Auth0.AspNetCore.Authentication.AuthenticationApi.Models
  summary: >-
    The token response from completing MFA with an OOB code.


    <p>

    OOB verification (push/SMS) is asynchronous: while the user has not yet approved the request,

    Auth0 answers with <code>authorization_pending</code> or <code>slow_down</code>. Those are surfaced on

    <xref href="Auth0.AspNetCore.Authentication.AuthenticationApi.Models.MfaOobTokenResponse.Error" data-throw-if-not-resolved="false"></xref>/<xref href="Auth0.AspNetCore.Authentication.AuthenticationApi.Models.MfaOobTokenResponse.ErrorDescription" data-throw-if-not-resolved="false"></xref> (with <xref href="Auth0.AspNetCore.Authentication.AuthenticationApi.Models.TokenBase.AccessToken" data-throw-if-not-resolved="false"></xref> null)

    so the caller can poll; any other failure throws an

    <xref href="Auth0.AspNetCore.Authentication.Exceptions.ErrorApiException" data-throw-if-not-resolved="false"></xref>. On success the token fields are populated and

    <xref href="Auth0.AspNetCore.Authentication.AuthenticationApi.Models.MfaOobTokenResponse.Error" data-throw-if-not-resolved="false"></xref> is null.

    </p>
  example: []
