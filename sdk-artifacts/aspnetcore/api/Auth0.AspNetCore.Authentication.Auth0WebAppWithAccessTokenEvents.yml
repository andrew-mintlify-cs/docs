- uid: Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenEvents.OnAccessTokenRefreshFailed
  commentId: P:Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenEvents.OnAccessTokenRefreshFailed
