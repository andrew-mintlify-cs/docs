    parameters: []
    return:
      type: System.Func{Auth0.AspNetCore.Authentication.AccessTokenRefreshFailedContext,System.Threading.Tasks.Task}
    content.vb: Public Property OnAccessTokenRefreshFailed As Func(Of AccessTokenRefreshFailedContext, Task)
