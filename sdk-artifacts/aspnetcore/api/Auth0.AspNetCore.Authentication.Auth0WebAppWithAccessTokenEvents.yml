  fullName: Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenEvents.OnTokensRefreshed
  type: Property
  source:
    remote:
      path: src/Auth0.AspNetCore.Authentication/Auth0WebAppWithAccessTokenEvents.cs
      branch: main
      repo: https://github.com/auth0/auth0-aspnetcore-authentication
    id: OnTokensRefreshed
    path: ../src/Auth0.AspNetCore.Authentication/Auth0WebAppWithAccessTokenEvents.cs
    startLine: 123
  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: >-
    Executed after a successful primary token refresh, allowing you to react to the new

    tokens (for example to mirror claims into another store, or invalidate caches). The

    supplied <xref href="Auth0.AspNetCore.Authentication.AccessTokenRefreshedContext" data-throw-if-not-resolved="false"></xref> carries the refreshed access, ID,

    and (when rotated) refresh tokens, plus the new expiry. This fires independently of

    <xref href="Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenOptions.RebuildPrincipalOnRefresh" data-throw-if-not-resolved="false"></xref>; when that

    option is enabled the principal has already been rebuilt by the time this fires.

    It does not fire on a failed refresh (see <xref href="Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenEvents.OnAccessTokenRefreshFailed" data-throw-if-not-resolved="false"></xref>),

    nor for additional-audience (MRRT) token fetches.


    <p>

    This handler runs inside the cookie middleware's <code>OnValidatePrincipal</code> event, so an

    exception thrown here is not swallowed — it surfaces into the authentication pipeline

    and fails the current request. Guard any I/O you perform here accordingly.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">services
      .AddAuth0WebAppAuthentication(options =&gt; {})
      .WithAccessToken(options =&gt;
      {
          options.UseRefreshTokens = true;
          options.Events = new Auth0WebAppWithAccessTokenEvents
          {
              OnTokensRefreshed = (context) =&gt;
              {
                  // React to the refreshed tokens, e.g. log or mirror claims.
                  return Task.CompletedTask;
              }
          };
      });</code></pre>
  syntax:
    content: public Func<AccessTokenRefreshedContext, Task>? OnTokensRefreshed { get; set; }
    parameters: []
    return:
      type: System.Func{Auth0.AspNetCore.Authentication.AccessTokenRefreshedContext,System.Threading.Tasks.Task}
    content.vb: Public Property OnTokensRefreshed As Func(Of AccessTokenRefreshedContext, Task)
  overload: Auth0.AspNetCore.Authentication.Auth0WebAppWithAccessTokenEvents.OnTokensRefreshed*
