  assemblies:
  - Auth0.AspNetCore.Authentication
  namespace: Auth0.AspNetCore.Authentication
  summary: Executed when an Access Token is missing where one was expected, allowing you to react accordingly.
  example:
  - >-
    <pre><code class="lang-csharp">services
      .AddAuth0WebAppAuthentication(options =&gt; {})
      .WithAccessToken(options =&gt;
      {
          options.Events = new Auth0WebAppWithAccessTokenEvents
          {
              OnMissingAccessToken = async (context) =&gt;
              {
                  await context.SignOutAsync(CookieAuthenticationDefaults.AuthenticationScheme);
                  var authenticationProperties = new AuthenticationPropertiesBuilder().WithRedirectUri("/").Build();
                  await context.ChallengeAsync(Auth0Constants.AuthenticationScheme, authenticationProperties);
              }
          };
      });</code></pre>
